name: refresh profile

# Re-derives the values that can go stale — right now the Lang row, which is
# the two most-used languages by byte count across every non-fork repo — and
# commits only when the rendered output actually changed.
#
# Commits are authored by github-actions[bot] on purpose: a bot commit does
# not land on a person's contribution graph, so a daily job cannot dress the
# profile up with activity nobody did.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render.py --live

      - name: Commit if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no change"
          else
            git commit -am "Refresh profile values"
            git push
          fi
